name = "expense-intake"
main = "src/index.js"
compatibility_date = "2026-08-17"

[[d1_databases]]
binding = "DB"
database_name = "expense-intake-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[vars]
AI_PROVIDER = "openrouter"

[[r2_buckets]]
binding = "RECEIPTS_BUCKET"
bucket_name = "expense-intake-receipts"

[images]
binding = "IMAGES"

# KV namespace (conversation state: house-selection pending, correction window),
# routes, and [[triggers]] cron entries are added in later Build Order steps
# (5-7) once the code that uses them exists.
